
enum MarketStatus {
  OPEN
  RESOLVED
  INVALID
}

"""
A prediction market opened under a tweet. One per questionId.
Mutable: volume, fills and participants grow as ringos land.
"""
type Market @entity(immutable: false) {
  """
  keccak256(ringoId) as a hex string — the indexed topic, not the ringoId.

  ringoId is indexed on a dynamic `bytes`, so the log only ever carries its
  hash, and the plaintext lives in calldata that on this contract is an
  ERC-4337 `handleOps` blob. A caller holding a ringoId reaches its market with
  keccak256(ringoId); see src/ringo-id.ts and docs/queries.md.
  """
  id: ID!

  """
  From QuestionCreated(bytes ringoId, bytes32 questionId). Typed String, not
  Bytes, because the backend filters on it as a String — a Bytes field would
  fail validation and return null, which is indistinguishable from no data.

  Null for anything created before block 85629763: QuestionCreated only starts
  firing then, while resolutions go back to the start block.
  """
  questionId: String

  """
  NOT AVAILABLE ON CHAIN. RingoManager emits no claim text, so this is always
  null. It stays in the schema because removing it would break the backend's
  query validation mid-week; it is not a field anyone should read.
  """
  claim: String

  """
  NOT AVAILABLE ON CHAIN. Tags are generated by Ringo's AI and live only in
  Mongo, so this array is always empty.

  Consequence, and it is not small: the backend's comparables query filters on
  `tags_contains`, so it matches nothing and the price hint can never fire.
  The fix is on the backend side — resolve tag to ids in Mongo, then query
  this subgraph with `id_in`. See docs/queries.md.
  """
  tags: [String!]!

  "NOT AVAILABLE ON CHAIN. QuestionCreated carries no address."
  creator: Bytes

  category: String
  status: MarketStatus!

  """
  MISNAMED, and knowingly so. RingoResolved's uint256 is an AMOUNT in raw
  USDC units (2000000 = 2 USDC), not an outcome index — confirmed on mainnet.
  The event says who won, never which side won.

  More precisely it is the gross pot, equal to amountA + amountB of the fill in
  every correlated case, and not what the winner banks. In resolution
  0x31cdbbcd…75bf the event reads 2.000000 while the escrow transfers 1.900000
  to the winner, the difference being the fee. Do not present it as winnings.

  The field keeps the name because the backend already queries it; renaming it
  to `payout` is a coordinated change with Manuel, not an ABI fix. Until then,
  do not render this as an outcome label.
  """
  outcome: BigInt
  createdAt: BigInt!
  resolvedAt: BigInt
  "Raw USDC units (6 decimals). Sum of amountA + amountB across fills."
  volume: BigInt!
  "Number of matched ringos"
  fills: Int!
  "Distinct addresses that took a side"
  participants: Int!

  ringos: [Ringo!]! @derivedFrom(field: "market")
  resolution: Resolution
}

"""
One matched bet: two sides filled against each other.
Immutable — a fill is never rewritten.
"""
type Ringo @entity(immutable: true) {
  "txHash-logIndex"
  id: ID!
  market: Market!
  userA: Trader!
  userB: Trader!
  amountA: BigInt!
  amountB: BigInt!
  timestamp: BigInt!
  tx: Bytes!

  """
  NOT AVAILABLE. RingoCreatedAndFilled is
  (bytes, address, address, uint256, uint256, address); the sixth address is
  the per-ringo escrow — it receives both stakes and pays the fee. Nothing in
  the event records which side each user took.

  Which side *won* is a separate question, and RingoResolved does answer it:
  its indexed address is the winning trader. Trader.wins and Trader.losses are
  derived from that, so the record column is real — what stays unavailable is
  the label ("yes" / "no") each address was betting on.
  """
  outcomeA: String

  """
  [userA, userB]. Exists so Trader.ringos can be a single @derivedFrom;
  a derived field can only point at one foreign key, and a trader can sit
  on either side of a fill.
  """
  traders: [Trader!]!
}

type Resolution @entity(immutable: true) {
  "txHash-logIndex"
  id: ID!
  market: Market!
  "Payout in raw USDC units. Misnamed — see the note on Market.outcome."
  outcome: BigInt!
  "The winning address, from RingoResolved's indexed second argument."
  resolver: Bytes
  timestamp: BigInt!
}

"""
A USDC transfer into one of Ringo's fee addresses.
Sourced from the USDC contract, not from RingoManager.
"""
type FeeEvent @entity(immutable: true) {
  "txHash-logIndex"
  id: ID!
  from: Bytes!
  to: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  tx: Bytes!
}

type Trader @entity(immutable: false) {
  "address as a hex string"
  id: ID!
  ringos: [Ringo!]! @derivedFrom(field: "traders")
  "Raw USDC units staked across all fills, both sides"
  volume: BigInt!
  "Resolutions this address won, from RingoResolved's indexed winner"
  wins: Int!
  """
  Fills this address sat on that resolved in favour of the other side.

  Lower than a true lifetime record: a market whose fill predates the start
  block has no fill row here, so its loser cannot be identified. Wins do not
  have that gap — the winner is named by the resolution itself.
  """
  losses: Int!
  lastActive: BigInt!
}

type DailyStat @entity(immutable: false) {
  "UTC day index (unix timestamp / 86400), as a string. Sorts chronologically."
  id: ID!
  "Midnight UTC of that day"
  date: BigInt!
  volume: BigInt!
  fills: Int!
  fees: BigInt!
  activeTraders: Int!
}

"""
Totals a query cannot compute.

A subgraph has no COUNT at query time, so "how many distinct traders are there"
either gets accumulated while indexing or does not exist. Paging every Trader
row to measure its own length is the alternative, and it stops working the day
the answer passes 1000.
"""
type Global @entity(immutable: false) {
  "Always \"global\". There is one row."
  id: ID!
  "Distinct addresses that have taken a side or won a resolution"
  traders: Int!
  "Markets seen, including the ones stubbed from a resolution we could not pair with a creation"
  markets: Int!
}

# ---------------------------------------------------------------------------
# Internal deduplication entities. Not meant to be queried by the agent or the
# stats page — they exist because counting distinct things in a subgraph needs
# a presence marker, there is no COUNT DISTINCT at query time.
# ---------------------------------------------------------------------------

"marketId-traderId. Presence means this trader already counted toward Market.participants."
type MarketParticipant @entity(immutable: true) {
  id: ID!
}

"dayId-traderId. Presence means this trader already counted toward DailyStat.activeTraders."
type DailyActiveTrader @entity(immutable: true) {
  id: ID!
}
